[workspace]
authors = ["ben <ben.uzh@proton.me>"]
channels = ["conda-forge", "bioconda"]
name = "onlinepca-jl"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
instantiate = "julia --project=. -e 'using Pkg; Pkg.instantiate()'"
check = "julia --project=. check.jl"
validate = "python validators/pca_output.py"
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) envs/onlinepca-jl.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/onlinepca-jl.yml"

[dependencies]
julia = ">=1.10,<2"
python = ">=3.12,<3.15"
h5py = ">=3.10,<4"
numpy = ">=1.26,<3"
